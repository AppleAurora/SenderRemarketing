services:
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: senderremarketing-whatsapp:local
    container_name: senderremarketing-whatsapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      SESSION_DATA_DIR: /data/whatsapp
      MAX_SESSIONS: "1"
      WHATSAPP_SESSION_SERVICE_TOKEN: ${WHATSAPP_SESSION_SERVICE_TOKEN:?Defini la clave en el archivo .env}
    volumes:
      - whatsapp_sessions:/data
    shm_size: "512mb"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  whatsapp_sessions:
